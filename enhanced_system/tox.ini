[tox]
envlist = py39,py310,py311,coverage,lint
skipsdist = False
isolated_build = True

[testenv]
extras = dev
commands = pytest {posargs}

[testenv:coverage]
extras = dev
commands =
    pytest --cov=enhanced_system --cov-report=term --cov-report=xml {posargs}

[testenv:lint]
extras = dev
commands =
    ruff check enhanced_system scripts tests
    ruff format --check enhanced_system scripts tests
