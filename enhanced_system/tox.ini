[tox]
envlist = py39,py310,py311,coverage,lint
skipsdist = True

[testenv]
deps = -r requirements-dev.txt
commands = pytest {posargs}

[testenv:coverage]
deps = -r requirements-dev.txt
commands = 
    pytest --cov=enhanced_system --cov-report=html --cov-report=term --cov-report=xml
    coverage report --fail-under=80

[testenv:lint]
deps = 
    flake8
    black
    mypy
commands =
    flake8 enhanced_system --max-line-length=100 --extend-ignore=E203,W503
    black --check enhanced_system
    mypy enhanced_system --ignore-missing-imports

[testenv:format]
deps = black
commands = black enhanced_system tests

