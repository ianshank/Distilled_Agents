# Canonical pytest config is the repo-root pyproject.toml.
# This file applies only when pytest is invoked from enhanced_system/.
[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow running tests
    benchmark: Performance benchmarks
asyncio_mode = auto
addopts =
    -v
    --strict-markers
    --tb=short
