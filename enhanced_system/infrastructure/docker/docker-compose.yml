version: '3.8'

services:
  # Enhanced Agent Application
  app:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    container_name: enhanced-agent-app
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - ENHANCED_SYSTEM_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PROMETHEUS_PORT=9090
    depends_on:
      - redis
      - prometheus
    volumes:
      - ../../logs:/app/logs
      - ../../data:/app/data
      - ../../models:/app/models
    networks:
      - enhanced-network
    restart: unless-stopped

  # Redis for L2 Caching
  redis:
    image: redis:7.2-alpine
    container_name: enhanced-redis
    expose:
      - "6379"
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - enhanced-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Prometheus for Metrics Collection
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: enhanced-prometheus
    ports:
      - "9091:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - enhanced-network
    restart: unless-stopped

  # Grafana for Visualization
  grafana:
    image: grafana/grafana:11.2.0
    container_name: enhanced-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/dashboard.json:ro
    networks:
      - enhanced-network
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  enhanced-network:
    driver: bridge

