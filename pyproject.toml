[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mangomas"
version = "1.0.0"
description = "MangoMAS Distilled Agents: train, deploy, and run specialized LoRA agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MangoMAS Team" }]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-timeout>=2.1.0",
    "ruff>=0.6.0",
    "mypy>=1.4.0",
    "bandit>=1.7.5",
    "pip-audit>=2.7.0",
    "pre-commit>=3.3.0",
    "types-PyYAML>=6.0.0",
    "types-requests>=2.31.0",
]
aws = [
    "boto3>=1.26.0",
    "botocore>=1.29.0",
    "sagemaker>=2.150.0",
]
ml = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "datasets>=2.12.0",
    "accelerate>=0.22.0",
    "peft==0.4.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
]
cache = [
    "redis>=4.5.0",
]
monitor = [
    "prometheus-client>=0.17.0",
]
security = [
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
]
inference = [
    "flask>=2.3.0",
    "gunicorn>=21.0.0",
]
cli = [
    "rich>=13.0.0",
    "tqdm>=4.65.0",
]
all = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-timeout>=2.1.0",
    "ruff>=0.6.0",
    "mypy>=1.4.0",
    "bandit>=1.7.5",
    "pip-audit>=2.7.0",
    "pre-commit>=3.3.0",
    "types-PyYAML>=6.0.0",
    "types-requests>=2.31.0",
    "boto3>=1.26.0",
    "botocore>=1.29.0",
    "sagemaker>=2.150.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "datasets>=2.12.0",
    "accelerate>=0.22.0",
    "peft==0.4.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "redis>=4.5.0",
    "prometheus-client>=0.17.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "flask>=2.3.0",
    "gunicorn>=21.0.0",
    "rich>=13.0.0",
    "tqdm>=4.65.0",
]

[project.urls]
Homepage = "https://github.com/ianshank/Distilled_Agents"

[tool.setuptools.packages.find]
include = ["enhanced_system*", "scripts*"]

[tool.setuptools.package-data]
enhanced_system = ["config/*.yaml", "config/*.json"]
"scripts.training" = ["requirements.txt"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["enhanced_system/tests", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
    "benchmark: Performance benchmarks",
]
asyncio_mode = "auto"
addopts = "-v --strict-markers --tb=short"

[tool.coverage.run]
source = ["enhanced_system"]
omit = [
    "*/tests/*",
    "*/examples/*",
    "*/scripts/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["enhanced_system", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E203",
    "E501",
    "B008",
    "UP006",  # legacy List/Dict annotations; ratchet later
    "UP035",
    "UP045",
    "F403",   # star-imports from constants/enums
    "F405",
]

[tool.ruff.lint.per-file-ignores]
"enhanced_system/tests/conftest.py" = ["E402"]
"enhanced_system/examples/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.bandit]
exclude_dirs = ["tests", "enhanced_system/tests", ".venv", "enhanced_system/examples"]
skips = [
    "B101",
    "B105",  # false positives on pass_rate / numeric defaults
    "B106",  # false positives on token="" kwargs
]
