[tox]
envlist = py39,py310,py311,coverage,harness,lint
isolated_build = true

[testenv]
extras = dev
commands = pytest -m "unit or integration" {posargs}

[testenv:coverage]
extras = dev
commands =
    pytest -m "unit or integration" --cov=enhanced_system --cov-report=term --cov-report=xml {posargs}

[testenv:harness]
extras = dev
commands =
    pytest -m harness --cov-config=.coveragerc.harness --cov=enhanced_system.harness --cov-report=term {posargs}

[testenv:lint]
skip_install = true
deps = ruff
commands =
    ruff check enhanced_system scripts tests
    ruff format --check enhanced_system scripts tests
